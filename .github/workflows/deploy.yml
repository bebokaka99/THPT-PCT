name: Deploy Release

on:
  workflow_run:
    workflows:
      - Quality Gate
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: Deploy the selected SHA or roll back one release
        required: true
        type: choice
        options:
          - deploy
          - rollback
      release_sha:
        description: Full commit SHA for deploy; ignored for rollback
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  staging:
    name: Staging deploy and smoke
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on:
      - self-hosted
      - linux
      - staging
    environment: staging
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
      DEPLOY_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }}
      DEPLOY_STATE_ROOT: ${{ vars.DEPLOY_STATE_ROOT }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Materialize protected deployment environment
        shell: bash
        env:
          DEPLOY_ENV_B64: ${{ secrets.DEPLOY_ENV_B64 }}
        run: |
          if [ -z "$DEPLOY_ENV_B64" ]; then
            echo "DEPLOY_ENV_B64 is required in the staging environment." >&2
            exit 1
          fi
          env_file="$RUNNER_TEMP/thpt-pct-pt-staging.env"
          umask 077
          printf '%s' "$DEPLOY_ENV_B64" | base64 --decode > "$env_file"
          test -s "$env_file"
          echo "DEPLOY_ENV_FILE=$env_file" >> "$GITHUB_ENV"

      - name: Resolve image prefix
        id: images
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner}/${repository}" >> "$GITHUB_OUTPUT"

      - name: Deploy or roll back staging
        shell: bash
        run: |
          if [ "$DEPLOY_ACTION" = "rollback" ]; then
            bash tools/rollback-release.sh staging "$DEPLOY_ENV_FILE"
          else
            bash tools/deploy-release.sh \
              staging \
              "$RELEASE_SHA" \
              "${{ steps.images.outputs.prefix }}" \
              "$DEPLOY_ENV_FILE"
            echo "DEPLOY_COMPLETED=true" >> "$GITHUB_ENV"
          fi

      - name: Smoke staging
        shell: bash
        run: bash tools/smoke-deployment.sh "$APP_URL"

      - name: Roll back failed staging deployment
        if: failure() && env.DEPLOY_ACTION == 'deploy' && env.DEPLOY_COMPLETED == 'true' && env.DEPLOY_ENV_FILE != ''
        shell: bash
        run: bash tools/rollback-release.sh staging "$DEPLOY_ENV_FILE"

      - name: Remove staging deployment environment
        if: always() && env.DEPLOY_ENV_FILE != ''
        shell: bash
        run: rm -f -- "$DEPLOY_ENV_FILE"

  production:
    name: Production deploy and smoke
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production'
    runs-on:
      - self-hosted
      - linux
      - production
    environment: production
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_ACTION: ${{ inputs.action }}
      DEPLOY_STATE_ROOT: ${{ vars.DEPLOY_STATE_ROOT }}
      APP_URL: ${{ vars.APP_URL }}
      BACKUP_ROOT: ${{ vars.BACKUP_ROOT }}
    steps:
      - name: Validate production request
        shell: bash
        run: |
          if [ "$DEPLOY_ACTION" = "deploy" ] && [ -z "$RELEASE_SHA" ]; then
            echo "release_sha is required for a production deploy." >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA || github.sha }}

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Materialize protected deployment environment
        shell: bash
        env:
          DEPLOY_ENV_B64: ${{ secrets.DEPLOY_ENV_B64 }}
        run: |
          if [ -z "$DEPLOY_ENV_B64" ]; then
            echo "DEPLOY_ENV_B64 is required in the production environment." >&2
            exit 1
          fi
          env_file="$RUNNER_TEMP/thpt-pct-pt-production.env"
          umask 077
          printf '%s' "$DEPLOY_ENV_B64" | base64 --decode > "$env_file"
          test -s "$env_file"
          {
            echo "DEPLOY_ENV_FILE=$env_file"
            echo "RELEASE_REPORT_PATH=$RUNNER_TEMP/production-readiness.json"
          } >> "$GITHUB_ENV"

      - name: Validate production environment contract
        if: env.DEPLOY_ACTION == 'deploy'
        shell: bash
        run: node tools/check-production-config.mjs --env-file "$DEPLOY_ENV_FILE"

      - name: Create encrypted pre-release backup
        if: env.DEPLOY_ACTION == 'deploy'
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_ROOT" ]; then
            echo "BACKUP_ROOT is required in the production environment." >&2
            exit 1
          fi
          node tools/backup-postgres.mjs \
            --env-file "$DEPLOY_ENV_FILE" \
            --project-name thpt-pct-pt-production \
            --output-dir "$BACKUP_ROOT" \
            --retention-days 30

      - name: Resolve image prefix
        id: images
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner}/${repository}" >> "$GITHUB_OUTPUT"

      - name: Deploy or roll back production
        shell: bash
        run: |
          if [ "$DEPLOY_ACTION" = "rollback" ]; then
            bash tools/rollback-release.sh production "$DEPLOY_ENV_FILE"
          else
            bash tools/deploy-release.sh \
              production \
              "$RELEASE_SHA" \
              "${{ steps.images.outputs.prefix }}" \
              "$DEPLOY_ENV_FILE"
            echo "DEPLOY_COMPLETED=true" >> "$GITHUB_ENV"
          fi

      - name: Smoke production
        shell: bash
        run: bash tools/smoke-deployment.sh "$APP_URL"

      - name: Verify domain TLS and production headers
        if: env.DEPLOY_ACTION == 'deploy'
        shell: bash
        run: |
          node tools/check-production-readiness.mjs \
            --url "$APP_URL" \
            --report "$RELEASE_REPORT_PATH"

      - name: Smoke admin teacher and student access
        if: env.DEPLOY_ACTION == 'deploy'
        shell: bash
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_TEACHER_EMAIL: ${{ secrets.SMOKE_TEACHER_EMAIL }}
          SMOKE_TEACHER_PASSWORD: ${{ secrets.SMOKE_TEACHER_PASSWORD }}
          SMOKE_STUDENT_EMAIL: ${{ secrets.SMOKE_STUDENT_EMAIL }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
        run: node tools/smoke-role-access.mjs --base-url "$APP_URL"

      - name: Roll back failed production deployment
        if: failure() && env.DEPLOY_ACTION == 'deploy' && env.DEPLOY_COMPLETED == 'true' && env.DEPLOY_ENV_FILE != ''
        shell: bash
        run: bash tools/rollback-release.sh production "$DEPLOY_ENV_FILE"

      - name: Upload production readiness evidence
        if: always() && env.DEPLOY_ACTION == 'deploy'
        uses: actions/upload-artifact@v6
        with:
          name: production-readiness-${{ env.RELEASE_SHA }}
          path: ${{ env.RELEASE_REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove production deployment environment
        if: always() && env.DEPLOY_ENV_FILE != ''
        shell: bash
        run: rm -f -- "$DEPLOY_ENV_FILE"
